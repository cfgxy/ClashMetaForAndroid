name: Build Debug
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      build-abis:
        description: 'ABI matrix (comma separated). Leave empty to use gradle.properties default (arm64-v8a).'
        required: false
        default: ''
  push:
    branches:
      - main

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
            echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
            echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties
            echo "signing.properties generated: APK will be signed with release.keystore (stable across builds)"
          else
            echo "::warning::SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD secrets are not fully configured; skipping stable signing — APK falls back to debug signing (signature varies between builds)"
          fi

      - name: Build
        if: success()
        run: ./gradlew --no-daemon ${{ inputs.build-abis && format('-PbuildAbis={0}', inputs.build-abis) || '' }} app:assembleAlphaRelease

      # Upload whatever the configured ABI matrix produced; the matrix is driven by
      # gradle.properties `buildAbis` (default arm64-v8a) or the build-abis dispatch input.
      - name: Upload Aritfact
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: CMFA Debug APK
          path: |
            app/build/outputs/apk/alpha/release/*.apk
